<!DOCTYPE html>
<html>

<head>

    <title>Admin Login</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<div class="hero">

    <h1>Admin Login</h1>

    <form action="/login" method="POST">

        <label>Username</label><br>
        <input type="text"
               name="username"
               placeholder="Enter Username"
               required>

        <br><br>

        <label>Password</label><br>

        <input type="password"
               name="password"
               placeholder="Enter Password"
               required>

        <br><br>

        <button type="submit">
            Login
        </button>

    </form>

</div>

</body>

</html>
