<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Emergency Green Corridor Live Map</title>

    <link rel="stylesheet"
        href="https://unpkg.com/leaflet/dist/leaflet.css" />

    <style>

        body{
            margin:0;
            font-family:Arial, sans-serif;
            background:#f4f4f4;
        }

        h1{
            background:#008080;
            color:white;
            text-align:center;
            padding:15px;
            margin:0;
        }

        h3{
            text-align:center;
            color:red;
            margin:10px;
        }

        #map{
            height:80vh;
            width:100%;
        }

        .legend{
            text-align:center;
            background:white;
            padding:12px;
            font-size:18px;
            font-weight:bold;
        }

        .legend span{
            margin:20px;
        }

    </style>

</head>

<body>

<h1>🚑 Emergency Green Corridor Live Map</h1>

<h3>🚦 All Traffic Signals Changed to GREEN</h3>

<div class="legend">

<span>🚑 Ambulance</span>

<span>🏥 Hospital</span>

<span style="color:green;">━━ Green Corridor Route</span>

</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>

var map = L.map('map').setView([17.3850,78.4867],12);

L.tileLayer(
'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
{
    maxZoom:19
}).addTo(map);


// Ambulance Marker

var ambulance = L.marker([17.3850,78.4867])
.addTo(map)
.bindPopup("🚑 Ambulance");


// Hospital Marker

var hospital = L.marker([17.4435,78.3772])
.addTo(map)
.bindPopup("🏥 Hospital");


// Green Corridor Route

var route = L.polyline([
    [17.3850,78.4867],
    [17.3920,78.4740],
    [17.4010,78.4600],
    [17.4130,78.4400],
    [17.4250,78.4150],
    [17.4350,78.3950],
    [17.4435,78.3772]
],
{
    color:'green',
    weight:7
}).addTo(map);


// Live Ambulance Movement

var points = [

[17.3850,78.4867],
[17.3920,78.4740],
[17.4010,78.4600],
[17.4130,78.4400],
[17.4250,78.4150],
[17.4350,78.3950],
[17.4435,78.3772]

];

var i = 0;

setInterval(function(){

    if(i < points.length){

        ambulance.setLatLng(points[i]);

        i++;

    }

},1500);

</script>
<br><br>

<div style="text-align:center; margin:20px;">

    <a href="/notifications">
        <button style="
        background:gray;
        color:white;
        padding:12px 25px;
        border:none;
        border-radius:5px;
        font-size:16px;
        cursor:pointer;">
            ⬅ Back to Notifications
        </button>
    </a>

    &nbsp;&nbsp;

    <a href="/">
        <button style="
        background:green;
        color:white;
        padding:12px 25px;
        border:none;
        border-radius:5px;
        font-size:16px;
        cursor:pointer;">
            🏠 Finish → Home
        </button>
    </a>

</div>

</body>

</html>
