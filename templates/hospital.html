<!DOCTYPE html>
<html>

<head>

    <title>Hospital Dashboard</title>

    <style>

        body{
            font-family:Arial;
            background:#f5f5f5;
            padding:30px;
        }

        h1{
            text-align:center;
            color:#00695c;
        }

        table{
            width:100%;
            border-collapse:collapse;
            background:white;
        }

        th,td{
            border:1px solid #ccc;
            padding:12px;
            text-align:center;
        }

        th{
            background:#00695c;
            color:white;
        }

    </style>

</head>

<body>

<h1>🏥 Hospital Dashboard</h1>

<table>

<tr>

<th>ID</th>
<th>Ambulance</th>
<th>Driver</th>
<th>Patient</th>
<th>Emergency</th>
<th>Hospital</th>
<th>Status</th>

</tr>

{% for row in data %}

<tr>

<td>{{ row[0] }}</td>
<td>{{ row[1] }}</td>
<td>{{ row[2] }}</td>
<td>{{ row[4] }}</td>
<td>{{ row[6] }}</td>
<td>{{ row[8] }}</td>
<td>{{ row[11] }}</td>

</tr>

{% endfor %}

</table>
<br><br>

<div style="text-align:center;">

    <a href="/police">
        <button style="
        background:gray;
        color:white;
        padding:12px 25px;
        border:none;
        border-radius:5px;
        font-size:16px;">
            ⬅ Back to Police
        </button>
    </a>

    &nbsp;&nbsp;

    <a href="/traffic">
        <button style="
        background:orange;
        color:white;
        padding:12px 25px;
        border:none;
        border-radius:5px;
        font-size:16px;">
            🚦 Next → Traffic Dashboard
        </button>
    </a>

</div>

</body>

</html>
